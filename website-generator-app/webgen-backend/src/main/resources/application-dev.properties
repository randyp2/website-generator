spring.config.activate.on-profile=dev

# CORS for local dev Next.js port
cors.allowed.origins=http://localhost:3000

# Supabase & OpenAi Connections
supabase.project.url = ${SUPABASE_PROJECT_URL}
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY}

logging.level.org.springframework=INFO

# --- Postgresql DEV ---
spring.datasource.url=jdbc:postgresql://${SUPABASE_DB_HOST}:5432/postgres?sslmode=require
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Prevent Hibernate from touching schema
spring.jpa.hibernate.ddl-auto=none

# Fall back behaviour
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-timeout=5000
