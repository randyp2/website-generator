spring.config.activate.on-profile=dev

# CORS for local dev Next.js port
cors.allowed.origins=http://localhost:3000

# Supabase & OpenAi Connections
supabase.project.url = ${SUPABASE_PROJECT_URL}
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY}

logging.level.org.springframework=INFO

# Confirm entity mappings match schemas
spring.jpa.hibernate.ddl-auto=validate

# Fall back behaviour
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0

# local postgres
spring.datasource.url=jdbc:postgresql://localhost:5433/portrn_dev
spring.datasource.username=portrn
spring.datasource.password=portrn
 
# local redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# local rabbitmq
spring.rabbitmq.uri=amqp://guest:guest@localhost:5672
