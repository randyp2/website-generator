spring.config.activate.on-profile=prod

# CORS for only vercel domain
cors.allowed.origins=https://www.portfoliogenai.com,https://portfolioai-irr4bjfq8-portfolioais-projects.vercel.app

# Supabase & OpenAi Connections
supabase.project.url = ${SUPABASE_PROJECT_URL}
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY}

logging.level.org.springframework=WARN

# Supabase postgresql connection
spring.datasource.url=jdbc:postgresql://${SUPABASE_DB_HOST}:5432/postgres?sslmode=require
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=10000

# Redis connection
spring.data.redis.url=${UPSTASH_REDIS_URL}

# rabbitmq connection
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT:5671}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST}
spring.rabbitmq.ssl.enabled=true
spring.rabbitmq.ssl.validate-server-certificate=true
spring.rabbitmq.listener.simple.prefetch=1

# screenshot
webgen.screenshot.base-url=http://localhost:3000
supabase.service-role-key=${SUPABASE_SECRET_KEY}
