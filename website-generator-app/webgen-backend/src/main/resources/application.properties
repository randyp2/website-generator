# ====== SPRING OPEENAI CONFIGURATIONS ====== #
spring.application.name=webgen-backend
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-5
spring.ai.openai.chat.options.max-completion-tokens=15000
spring.ai.openai.chat.options.temperature=1
spring.ai.openai.chat.options.response-format.type=json_object


supabase.project.url = https://cadbniefkusbfkhmkptz.supabase.co



# ====== SPRING JPA CONFIGURATIONS ===== #
spring.datasource.url=jdbc:postgresql://localhost:5432/mydatabase
spring.datasource.username=postgres
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=false