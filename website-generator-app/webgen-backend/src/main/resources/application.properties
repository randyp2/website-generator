# ====== SPRING OPEENAI CONFIGURATIONS ====== #
spring.application.name=webgen-backend
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-5
spring.ai.openai.chat.options.max-completion-tokens=20000
spring.ai.openai.chat.options.temperature=1
spring.ai.openai.chat.options.response-format.type=json_object

# ====== CLARIFIER MODEL CONFIGURATIONS ====== #
spring.ai.openai.clarifier.model=gpt-4o-mini
spring.ai.openai.clarifier.max-tokens=2000
spring.ai.openai.clarifier.temperature=0.7

# ====== PLANNER MODEL CONFIGURATIONS ====== #
spring.ai.openai.planner.model=gpt-4o-mini
spring.ai.openai.planner.max-tokens=3000
spring.ai.openai.planner.temperature=0.7

# ====== JSX VALIDATOR CONFIGURATION ====== #
jsx.validator.script.path=scripts/validate-jsx.js
jsx.validator.node.path=node
jsx.validator.max-retries=3

# ====== RESUME PARSER MODEL CONFIGURATION ====== #
spring.ai.openai.resume-parser.model=gpt-4o-mini
spring.ai.openai.resume-parser.max-tokens=3000
spring.ai.openai.resume-parser.temperature=0.3

# ====== RESUME PARSER FEATURE FLAGS ====== #
resume.parser.confidence-threshold=0.40
resume.parser.llm-fallback-enabled=true
resume.parser.max-retries=3

# ====== STYLE CHAT MODEL CONFIGURATIONS ====== #
spring.ai.openai.style-chat.model=gpt-4o-mini
spring.ai.openai.style-chat.max-tokens=700
spring.ai.openai.style-chat.temperature=0.3

# ====== BLUEPRINT MODEL CONFIGURATIONS (creative planning) ====== #
spring.ai.openai.blueprint.model=gpt-5
spring.ai.openai.blueprint.max-completion-tokens=10000
spring.ai.openai.blueprint.temperature=1.0

# ====== SECTION MODEL CONFIGURATIONS (JSX code generation) ====== #
spring.ai.openai.section.model=gpt-5
spring.ai.openai.section.max-completion-tokens=20000
spring.ai.openai.section.temperature=1.0

# ====== SECTION REPAIR MODEL (low-temp JSX fix on retry) ====== #
spring.ai.openai.section-repair.model=gpt-4.1
spring.ai.openai.section-repair.max-completion-tokens=20000
spring.ai.openai.section-repair.temperature=0.2

# ====== PORTFOLIO GENERATION PROVIDER (anthropic | openai) ====== #
# webgen.ai.portfolio.provider=anthropic
webgen.ai.portfolio.provider=openai

# ====== ANTHROPIC CONFIGURATIONS ====== #
spring.ai.anthropic.api-key=${SPRING_AI_ANTHROPIC_API_KEY}

# ====== GEMINI CONFIGURATIONS ====== #
spring.ai.google.genai.api-key=${SPRING_AI_GEMINI_API_KEY}

# ====== ANTHROPIC BLUEPRINT MODEL (creative planning) ====== #
spring.ai.anthropic.blueprint.model=claude-sonnet-4-5
spring.ai.anthropic.blueprint.max-tokens=10000
spring.ai.anthropic.blueprint.temperature=1.0

# ====== ANTHROPIC SECTION MODEL (JSX code generation) ====== #
spring.ai.anthropic.section.model=claude-sonnet-4-5
spring.ai.anthropic.section.max-tokens=20000
spring.ai.anthropic.section.temperature=1.0

# ====== GEMINI STYLE CHAT MODEL CONFIGURATIONS ====== #
spring.ai.google.genai.style-chat.model=gemini-2.5-flash
spring.ai.google.genai.style-chat.max-output-tokens=700
spring.ai.google.genai.style-chat.temperature=0.3

# ====== GEMINI PLANNER MODEL CONFIGURATIONS ====== #
spring.ai.google.genai.planner.model=gemini-2.5-flash
spring.ai.google.genai.planner.max-output-tokens=3000
spring.ai.google.genai.planner.temperature=0.7

# ====== GEMINI ASSET VERIFICATION MODEL CONFIGURATIONS ====== #
spring.ai.google.genai.asset-verification.model=gemini-2.5-flash
spring.ai.google.genai.asset-verification.max-output-tokens=2000
spring.ai.google.genai.asset-verification.temperature=0.2

# ====== Flyway ======
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ====== Spring JPA ======
spring.jpa.hibernate.ddl-auto=validate

# ====== GITHUB OAUTH (CONNECTED ACCOUNTS) ====== #
github.oauth.client-id=${GITHUB_OAUTH_CLIENT_ID:}
github.oauth.client-secret=${GITHUB_OAUTH_CLIENT_SECRET:}
github.oauth.redirect-uri=${GITHUB_OAUTH_REDIRECT_URI:}
github.oauth.scopes=${GITHUB_OAUTH_SCOPES:read:user,user:email,repo}
github.oauth.state-ttl-seconds=${GITHUB_OAUTH_STATE_TTL_SECONDS:600}
github.oauth.token-encryption-secret=${GITHUB_OAUTH_TOKEN_ENCRYPTION_SECRET:}

# ====== CLOUDFLARE R2 (S3-COMPATIBLE STORAGE) ====== #
r2.account-id=${R2_ACCOUNT_ID:}
r2.access-key-id=${R2_ACCESS_KEY_ID:}
r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
r2.bucket-name=${R2_BUCKET_NAME:}
r2.endpoint=${R2_ENDPOINT:}
r2.region=${R2_REGION:auto}
r2.public-base-url=${R2_PUBLIC_BASE_URL:}

# ====== REDIS ======
spring.data.redis.repositories.enabled=false

# ====== INTERNAL API SECRET (frontend -> backend gate) ======
# Shared secret the Next.js server attaches as X-Internal-Secret. Blank = the
# check is dormant. enforce=false logs mismatches only (safe rollout); flip to
# true to reject with 403 once every frontend route sends the header.
internal.api.secret=${INTERNAL_API_SECRET:}
internal.api.enforce=${INTERNAL_API_ENFORCE:false}

# ====== RATE LIMITING (backend backstop for cost-heavy endpoints) ======
# Per-user fixed-window limits, keyed by JWT subject. Tune freely; toggle the
# whole layer with ratelimit.enabled. An unset policy fails open (never blocks).
ratelimit.enabled=${RATE_LIMIT_ENABLED:true}
# One-shot generation: blueprint + N section LLM calls (most expensive)
ratelimit.policies.portfolio-generate.limit=${RATE_LIMIT_GENERATE:3}
ratelimit.policies.portfolio-generate.window-seconds=600
# Refine build: LLM per modified section (fan-out)
ratelimit.policies.refine-build.limit=${RATE_LIMIT_REFINE_BUILD:8}
ratelimit.policies.refine-build.window-seconds=600
# Refine conversation turns (clarify + plan share this budget)
ratelimit.policies.refine-turn.limit=${RATE_LIMIT_REFINE_TURN:40}
ratelimit.policies.refine-turn.window-seconds=900
# Style chat: one LLM call per message
ratelimit.policies.style-chat.limit=${RATE_LIMIT_STYLE_CHAT:50}
ratelimit.policies.style-chat.window-seconds=900
# Style suggestions: one LLM call per request
ratelimit.policies.style-suggestions.limit=${RATE_LIMIT_STYLE_SUGGESTIONS:20}
ratelimit.policies.style-suggestions.window-seconds=900
# Resume parse: LLM fallback extraction
ratelimit.policies.resume-parse.limit=${RATE_LIMIT_RESUME_PARSE:10}
ratelimit.policies.resume-parse.window-seconds=300
# Public engagement writes (views/shares/profile-views), keyed by IP — caps
# metric-inflation loops while allowing normal browsing
ratelimit.policies.public-engagement.limit=${RATE_LIMIT_PUBLIC_ENGAGEMENT:30}
ratelimit.policies.public-engagement.window-seconds=60
# Public username availability, keyed by IP — caps enumeration
ratelimit.policies.public-username-check.limit=${RATE_LIMIT_USERNAME_CHECK:20}
ratelimit.policies.public-username-check.window-seconds=60
# Authenticated social writes (likes, comments, follows), keyed by user
ratelimit.policies.engagement-write.limit=${RATE_LIMIT_ENGAGEMENT_WRITE:40}
ratelimit.policies.engagement-write.window-seconds=60
# Draft creation (DB row per call), keyed by user
ratelimit.policies.portfolio-draft.limit=${RATE_LIMIT_DRAFT:20}
ratelimit.policies.portfolio-draft.window-seconds=300
# Ownership challenge creation performs public-host DNS validation
ratelimit.policies.site-verification-challenge.limit=${RATE_LIMIT_SITE_VERIFICATION_CHALLENGE:10}
ratelimit.policies.site-verification-challenge.window-seconds=300

# ====== STRIPE ======
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.success-url=${STRIPE_SUCCESS_URL:http://localhost:3000/dashboard/billing/success}
stripe.cancel-url=${STRIPE_CANCEL_URL:http://localhost:3000/dashboard/billing/cancel}
stripe.portal-return-url=${STRIPE_PORTAL_RETURN_URL:http://localhost:3000/pricing}

# ====== RESEND ======
resend.api-key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:}

# Price IDs from Stripe Dashboard
# Website Generator Pro pricing
stripe.price.website-generator-pro-monthly=${STRIPE_PRICE_WEBSITE_GENERATOR_PRO_MONTHLY:${STRIPE_PRICE_WEBSITE_GENERATOR_PRO:}}
stripe.price.website-generator-pro-annual=${STRIPE_PRICE_WEBSITE_GENERATOR_PRO_ANNUAL:}

# Credit pack pricing
stripe.price.credit-pack-small=${STRIPE_PRICE_CREDIT_PACK_SMALL:}
stripe.price.credit-pack-medium=${STRIPE_PRICE_CREDIT_PACK_MEDIUM:}
stripe.price.credit-pack-large=${STRIPE_PRICE_CREDIT_PACK_LARGE:}
