# ====== SPRING OPEENAI CONFIGURATIONS ====== #
spring.application.name=webgen-backend
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-5
spring.ai.openai.chat.options.max-completion-tokens=20000
spring.ai.openai.chat.options.temperature=1
spring.ai.openai.chat.options.response-format.type=json_object

# ====== CLARIFIER MODEL CONFIGURATIONS ====== #
spring.ai.openai.clarifier.model=gpt-4o-mini
spring.ai.openai.clarifier.max-tokens=2000
spring.ai.openai.clarifier.temperature=0.7

# ====== PLANNER MODEL CONFIGURATIONS ====== #
spring.ai.openai.planner.model=gpt-4o-mini
spring.ai.openai.planner.max-tokens=3000
spring.ai.openai.planner.temperature=0.7

# ====== JSX VALIDATOR CONFIGURATION ====== #
jsx.validator.script.path=scripts/validate-jsx.js
jsx.validator.node.path=node
jsx.validator.max-retries=3

# ====== RESUME PARSER MODEL CONFIGURATION ====== #
spring.ai.openai.resume-parser.model=gpt-4o-mini
spring.ai.openai.resume-parser.max-tokens=3000
spring.ai.openai.resume-parser.temperature=0.3

# ====== RESUME PARSER FEATURE FLAGS ====== #
resume.parser.confidence-threshold=0.40
resume.parser.llm-fallback-enabled=true
resume.parser.max-retries=3

# ====== STYLE CHAT MODEL CONFIGURATIONS ====== #
spring.ai.openai.style-chat.model=gpt-4o-mini
spring.ai.openai.style-chat.max-tokens=700
spring.ai.openai.style-chat.temperature=0.3

# ====== BLUEPRINT MODEL CONFIGURATIONS (creative planning) ====== #
spring.ai.openai.blueprint.model=gpt-5
spring.ai.openai.blueprint.max-completion-tokens=10000
spring.ai.openai.blueprint.temperature=1.0

# ====== SECTION MODEL CONFIGURATIONS (JSX code generation) ====== #
spring.ai.openai.section.model=gpt-5
spring.ai.openai.section.max-completion-tokens=20000
spring.ai.openai.section.temperature=1.0

# ====== ANTHROPIC CONFIGURATIONS ====== #
spring.ai.anthropic.api-key=${SPRING_AI_ANTHROPIC_API_KEY}

# ====== ANTHROPIC BLUEPRINT MODEL (creative planning) ====== #
spring.ai.anthropic.blueprint.model=claude-sonnet-4-5
spring.ai.anthropic.blueprint.max-tokens=10000
spring.ai.anthropic.blueprint.temperature=1.0

# ====== ANTHROPIC SECTION MODEL (JSX code generation) ====== #
spring.ai.anthropic.section.model=claude-sonnet-4-5
spring.ai.anthropic.section.max-tokens=20000
spring.ai.anthropic.section.temperature=1.0

# ====== Flyway ======
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ====== Spring JPA ======
spring.jpa.hibernate.ddl-auto=validate

# ====== REDIS ======
spring.data.redis.repositories.enabled=false
