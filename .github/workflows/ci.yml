# Name of workflow
name: CI

# Run workflow when:
# - Pushing to main & dev
# - Pull requests to main & dev
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Run the build job whenever our CI workflow is triggered
jobs:
  frontend-build:
    runs-on: ubuntu-latest

    # Placeholder env's
    env:
      UPSTASH_REDIS_REST_URL: https://example.com
      UPSTASH_REDIS_REST_TOKEN: dummy
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR1bW15Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3MDAwMDAwMDAsImV4cCI6MjAwMDAwMDAwMH0.abc123"

    steps:
      # Clone repo to get access to code
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install Frontend Dependencies
        working-directory: ./website-generator-app/frontend
        run: pnpm install

      - name: Frontend tests
        working-directory: ./website-generator-app/frontend
        run: pnpm test

      - name: Frontend build
        working-directory: ./website-generator-app/frontend
        run: pnpm build

  backend-build:
    runs-on: ubuntu-latest

    steps:
      # Clone repo to get access to code
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Make mvnw executable
        working-directory: ./website-generator-app/webgen-backend
        run: chmod +x mvnw

      - name: Build Backend & Run Tests
        working-directory: ./website-generator-app/webgen-backend
        run: ./mvnw clean package
